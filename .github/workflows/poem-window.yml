name: Poem form window

on:
  schedule:
    - cron: '35 18 * * *'   # 18:35 UTC = 00:05 India time
  workflow_dispatch: {}

jobs:
  set-status:
    runs-on: ubuntu-latest
    steps:
      - name: Open on days 1-25, close otherwise (India time)
        env:
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
          TALLY_FORM_ID: ${{ secrets.TALLY_FORM_ID }}
        run: |
          DAY=$(TZ=Asia/Kolkata date +%-d)
          if [ "$DAY" -le 25 ]; then
            BODY='{"status":"PUBLISHED","settings":{"isClosed":false}}'
            echo "India day $DAY -> opening the form"
          else
            BODY='{"status":"PUBLISHED","settings":{"isClosed":true,"closeMessageTitle":"Submissions are closed for now","closeMessageDescription":"The poem window is open from the 1st to the 25th of every month (India time). Please come back on the 1st of next month."}}'
            echo "India day $DAY -> closing the form"
          fi
          HTTP=$(curl -sS -o resp.json -w "%{http_code}" -X PATCH "https://api.tally.so/forms/${TALLY_FORM_ID}" \
            -H "Authorization: Bearer ${TALLY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          echo "Tally replied with HTTP $HTTP"
          cat resp.json
          echo
          [ "$HTTP" -lt 400 ]
